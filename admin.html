<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="portal.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><title>Admin Portal | Nicole Platten Accounting</title></head><body class="portal-body"><div class="portal-shell"><header class="portal-topbar"><a href="index.html"><img class="portal-logo" src="assets/logo.png" alt="Nicole Platten Accounting"></a><div class="portal-actions"><span class="status-pill">Nicole Admin</span><button id="logoutBtn" class="portal-btn secondary">Sign out</button></div></header><main class="admin-layout"><aside class="portal-card pad"><span class="portal-kicker">Clients</span><h2>Client list</h2><button id="newClientBtn" class="portal-btn">+ Add client</button><div id="clientList" class="client-list"></div></aside><section class="portal-card pad"><div id="adminEmpty"><span class="portal-kicker">Client management</span><h1>Select a client</h1><p class="portal-muted">Choose a client to update their progress, actions and messages.</p></div><form id="clientEditor" class="portal-form hidden"><input id="editClientId" type="hidden"><span class="portal-kicker">Client record</span><h1 id="editHeading">Edit client</h1><div class="row2"><div><label>Client name</label><input id="editName" required></div><div><label>Service</label><input id="editService" placeholder="e.g. Self Assessment"></div></div><div class="row2"><div><label>Status</label><input id="editStatus" placeholder="In progress"></div><div><label>Progress %</label><input id="editProgress" type="number" min="0" max="100"></div></div><div><label>Current stage</label><select id="editStage"><option>Information received</option><option>Accounts preparation</option><option>Accounts review</option><option>Tax return preparation</option><option>Client approval</option><option>Submitted to HMRC</option><option>Completed</option></select></div><div><label>Next action</label><input id="editAction" placeholder="Nothing needed right now"></div><div><label>Next action detail</label><textarea id="editActionDetail"></textarea></div><div id="adminMessage" hidden></div><button class="portal-btn" type="submit">Save client update</button><hr style="border:0;border-top:1px solid var(--line);width:100%"><label>Send a portal message</label><textarea id="newMessage" placeholder="Write an update the client will see…"></textarea><button id="sendMessageBtn" class="portal-btn secondary" type="button">Add message</button></form><form id="newClientForm" class="portal-form hidden"><span class="portal-kicker">New client</span><h1>Create client login</h1><div class="row2"><div><label>Name</label><input id="newName" required></div><div><label>Email</label><input id="newEmail" type="email" required></div></div><div class="row2"><div><label>Temporary password</label><input id="newPassword" type="password" minlength="8" required></div><div><label>Service</label><input id="newService" placeholder="Self Assessment"></div></div><div id="newClientMessage" hidden></div><button class="portal-btn" type="submit">Create client</button><button id="cancelNewClient" class="portal-btn secondary" type="button">Cancel</button></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="portal-config.js"></script><script src="admin.js"></script></body></html>
