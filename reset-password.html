<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="portal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <title>Reset Password | Nicole Platten Accounting</title>
</head>
<body class="portal-body">
  <div class="portal-shell">
    <header class="portal-topbar">
      <a href="index.html"><img class="portal-logo" src="assets/logo.png" alt="Nicole Platten Accounting"></a>
      <a class="portal-link" href="client-login.html">← Back to sign in</a>
    </header>

    <main class="login-wrap">
      <section class="portal-card login-card">
        <span class="portal-kicker">Secure client area</span>
        <h1>Reset your password</h1>
        <p class="portal-muted">Choose a new password for your Nicole Platten Accounting portal account.</p>

        <form id="resetPasswordForm" class="portal-form">
          <div>
            <label for="resetNewPassword">New password</label>
            <input id="resetNewPassword" type="password" minlength="10" autocomplete="new-password" required>
            <small class="field-help">Use at least 10 characters.</small>
          </div>
          <div>
            <label for="resetConfirmPassword">Confirm new password</label>
            <input id="resetConfirmPassword" type="password" minlength="10" autocomplete="new-password" required>
          </div>

          <div id="resetPasswordStatus" hidden></div>

          <button class="portal-btn" type="submit">Save new password</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="portal-config.js"></script>
  <script src="portal.js"></script>
</body>
</html>
